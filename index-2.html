<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack — Health & Fitness Tracker (Gemini-powered)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:#1D9E75; --green-light:#E1F5EEF; --green-dark:#085041;
  --blue:#185FA5; --blue-light:#E6F1FB; --blue-dark:#042C53;
  --amber:#BA7517; --amber-light:#FAEEDA; --amber-dark:#412402;
  --red:#A32D2D; --red-light:#FCEBEB; --red-dark:#501313;
  --purple:#534AB7; --purple-light:#EEEDFE; --purple-dark:#26215C;
  --bg:#F2F4F7; --card:#FFFFFF; --border:#E4E7EE;
  --text:#1A1C2E; --muted:#6B7280; --subtle:#9CA3AF;
  --shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  --r:12px; --rs:8px;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; line-height:1.5; }

/* ── SCREENS ── */
.screen { display:none; min-height:100vh; }
.screen.active { display:flex; flex-direction:column; }

/* ── PROFILE PICKER ── */
#scr-profiles { background:linear-gradient(135deg,#1D9E75 0%,#185FA5 100%); align-items:center; justify-content:center; padding:24px 16px; }
.profiles-box { background:#fff; border-radius:20px; padding:32px 28px; width:100%; max-width:500px; box-shadow:var(--shadow-lg); }
.app-brand { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.brand-icon { width:44px; height:44px; background:linear-gradient(135deg,var(--green),var(--blue)); border-radius:12px; display:flex; align-items:center; justify-content:center; }
.brand-icon i { color:#fff; font-size:22px; }
.brand-name { font-size:24px; font-weight:800; color:var(--text); letter-spacing:-.5px; }
.brand-tagline { font-size:13px; color:var(--muted); margin-bottom:28px; }
.pgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.ptile { border:2px solid var(--border); border-radius:var(--r); padding:18px 10px; text-align:center; cursor:pointer; transition:all .18s; background:#fff; }
.ptile:hover { border-color:var(--green); box-shadow:0 0 0 4px rgba(29,158,117,.1); transform:translateY(-2px); }
.ptile .pav { width:52px; height:52px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; color:#fff; }
.ptile .pn { font-size:13px; font-weight:700; margin-bottom:2px; }
.ptile .pg { font-size:11px; color:var(--muted); }
.add-ptile { border-style:dashed; background:var(--bg); flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:110px; color:var(--muted); font-size:12px; font-weight:600; }
.add-ptile:hover { border-color:var(--green); color:var(--green); background:#E1F5EE; }
.add-ptile i { font-size:26px; color:var(--green); }

/* ── NEW PROFILE ── */
#scr-new { background:var(--bg); }
.form-hdr { background:linear-gradient(135deg,var(--green),var(--blue)); padding:18px 24px; display:flex; align-items:center; gap:12px; }
.form-hdr h1 { font-size:18px; font-weight:700; color:#fff; }
.back-btn { width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.2); border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
.back-btn:hover { background:rgba(255,255,255,.35); }
.form-body { padding:20px; overflow-y:auto; flex:1; max-width:640px; }
.fsec { background:#fff; border-radius:var(--r); padding:20px; margin-bottom:14px; box-shadow:var(--shadow); border:1px solid var(--border); }
.fsec-title { font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:16px; display:flex; align-items:center; gap:7px; }
.fsec-title i { font-size:16px; color:var(--green); }
.fg2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.fg3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.fg { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.fg:last-child { margin-bottom:0; }
.fg label { font-size:12px; font-weight:700; color:var(--muted); }
.fg input,.fg select,.fg textarea { padding:10px 12px; border:2px solid var(--border); border-radius:var(--rs); font-size:14px; color:var(--text); background:#fff; font-family:inherit; transition:border-color .15s,box-shadow .15s; }
.fg input:focus,.fg select:focus,.fg textarea:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(29,158,117,.12); }
.fg textarea { resize:vertical; min-height:70px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { padding:6px 14px; border-radius:20px; border:2px solid var(--border); font-size:12px; font-weight:600; cursor:pointer; background:#fff; color:var(--muted); font-family:inherit; transition:all .15s; }
.chip:hover { border-color:var(--green); color:var(--green-dark); }
.chip.on { background:#E1F5EE; color:var(--green-dark); border-color:var(--green); }
.chip.on-red { background:var(--red-light); color:var(--red-dark); border-color:var(--red); }
.cta { width:100%; padding:14px; background:linear-gradient(135deg,var(--green),var(--blue)); color:#fff; border:none; border-radius:var(--r); font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; transition:opacity .15s; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px; }
.cta:hover { opacity:.9; }
.cta:active { opacity:.8; }

/* ── APP SHELL ── */
#scr-app { background:var(--bg); flex-direction:row; height:100vh; overflow:hidden; }
.sidebar { width:220px; background:#fff; border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.sb-top { padding:18px 14px 14px; border-bottom:1px solid var(--border); }
.sb-brand { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.sb-brand-icon { width:30px; height:30px; background:linear-gradient(135deg,var(--green),var(--blue)); border-radius:8px; display:flex; align-items:center; justify-content:center; }
.sb-brand-icon i { color:#fff; font-size:15px; }
.sb-brand-name { font-size:16px; font-weight:800; letter-spacing:-.3px; }
.user-pill { background:var(--bg); border:2px solid var(--border); border-radius:10px; padding:9px 12px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:all .15s; }
.user-pill:hover { border-color:var(--green); background:#E1F5EE; }
.upav { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; flex-shrink:0; }
.upname { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.upsub { font-size:10px; color:var(--muted); }
.sb-nav { flex:1; padding:10px 8px; overflow-y:auto; }
.nav-lbl { font-size:10px; font-weight:800; color:var(--subtle); text-transform:uppercase; letter-spacing:.7px; padding:10px 10px 4px; }
.nb { display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--rs); cursor:pointer; font-size:13px; color:var(--muted); margin-bottom:1px; border:none; background:transparent; width:100%; text-align:left; font-family:inherit; font-weight:600; transition:all .15s; }
.nb i { font-size:17px; width:20px; flex-shrink:0; }
.nb:hover { background:var(--bg); color:var(--text); }
.nb.on { background:#E1F5EE; color:var(--green-dark); }
.nb.on i { color:var(--green); }
.sb-date { border-top:1px solid var(--border); padding:12px 14px; }
.dlbl { font-size:10px; font-weight:800; color:var(--subtle); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
.drow { display:flex; align-items:center; gap:4px; }
.darr { width:26px; height:26px; border:2px solid var(--border); border-radius:6px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; transition:all .15s; }
.darr:hover { border-color:var(--green); color:var(--green); }
.dval { flex:1; text-align:center; font-size:12px; font-weight:700; }

/* ── MAIN ── */
.main { flex:1; overflow-y:auto; }
.page { display:none; padding:24px; }
.page.active { display:block; }
.ph { margin-bottom:20px; }
.ph h2 { font-size:22px; font-weight:800; letter-spacing:-.4px; margin-bottom:3px; }
.ph p { font-size:13px; color:var(--muted); }

/* ── CARD ── */
.card { background:#fff; border-radius:var(--r); box-shadow:var(--shadow); padding:20px; margin-bottom:14px; border:1px solid var(--border); }
.ch { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.ct { font-size:14px; font-weight:700; display:flex; align-items:center; gap:7px; }
.ct i { font-size:17px; color:var(--green); }

/* ── METRICS ── */
.mrow { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
.mrow2 { grid-template-columns:repeat(2,1fr); }
.mc { background:#fff; border-radius:var(--r); box-shadow:var(--shadow); padding:16px; border:1px solid var(--border); position:relative; overflow:hidden; }
.mc::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
.mc.g::before { background:var(--green); } .mc.b::before { background:var(--blue); }
.mc.a::before { background:var(--amber); } .mc.r::before { background:var(--red); }
.mc.p::before { background:var(--purple); }
.ml { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:5px; }
.mv { font-size:26px; font-weight:800; line-height:1; margin-bottom:3px; }
.ms { font-size:11px; color:var(--muted); }
.ptrack { height:6px; background:var(--bg); border-radius:3px; margin-top:8px; overflow:hidden; }
.pfill { height:100%; border-radius:3px; transition:width .5s; }

/* ── BADGES ── */
.bg { display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
.bg-g { background:#E1F5EE; color:var(--green-dark); }
.bg-b { background:var(--blue-light); color:var(--blue-dark); }
.bg-a { background:var(--amber-light); color:var(--amber-dark); }
.bg-r { background:var(--red-light); color:var(--red-dark); }
.bg-p { background:var(--purple-light); color:var(--purple-dark); }

/* ── ROWS ── */
.lrow { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); }
.lrow:last-child { border-bottom:none; padding-bottom:0; }
.lrow:first-child { padding-top:0; }
.rn { font-size:13px; font-weight:600; }
.rs { font-size:11px; color:var(--muted); margin-top:2px; }
.rr { display:flex; align-items:center; gap:8px; }

/* ── BTNS ── */
.btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:var(--rs); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s; border:2px solid transparent; }
.btn-p { background:var(--green); color:#fff; } .btn-p:hover { background:#179964; }
.btn-o { background:#fff; color:var(--text); border-color:var(--border); } .btn-o:hover { border-color:var(--green); color:var(--green); }
.btn-d { background:var(--red-light); color:var(--red); } .btn-d:hover { background:var(--red); color:#fff; }
.btn-sm { padding:5px 10px; font-size:12px; border-radius:6px; }
.btn-ic { width:28px; height:28px; padding:0; justify-content:center; border-radius:6px; }
.bgrp { display:flex; gap:8px; flex-wrap:wrap; }

/* ── RESULT BOX ── */
.rbox { border:2px solid var(--green); background:linear-gradient(135deg,#E1F5EE,#fff); border-radius:var(--r); padding:16px; margin-top:12px; }
.rbox-r { border-color:var(--red); background:linear-gradient(135deg,var(--red-light),#fff); }
.rbox-name { font-size:15px; font-weight:800; color:var(--green-dark); margin-bottom:3px; }
.rbox-name-r { color:var(--red-dark); }
.rbox-cal { font-size:30px; font-weight:800; color:var(--green); line-height:1; }
.rbox-cal-r { color:var(--red); }
.macros { display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; }
.mac { background:rgba(255,255,255,.8); border:1px solid rgba(29,158,117,.2); border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; color:var(--green-dark); }

/* ── MEAL ── */
.mgrp { margin-bottom:14px; }
.mgrp:last-child { margin-bottom:0; }
.mlbl { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }

/* ── BMI ── */
.bmi-wrap { margin:10px 0 6px; }
.bmi-bar { position:relative; height:10px; border-radius:5px; background:linear-gradient(to right,#185FA5 0%,#1D9E75 18.5%,#639922 25%,#EF9F27 30%,#D85A30 40%,#A32D2D 100%); }
.bmi-pin { position:absolute; top:-5px; width:4px; height:20px; background:var(--text); border-radius:2px; transform:translateX(-50%); box-shadow:0 1px 4px rgba(0,0,0,.3); }
.bmi-leg { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:4px; }

/* ── AI ── */
.ai-out { background:var(--bg); border:1.5px solid var(--border); border-radius:var(--rs); padding:16px; font-size:13px; line-height:1.75; color:var(--text); white-space:pre-wrap; max-height:420px; overflow-y:auto; }
.loading { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; padding:14px 0; }
.spin { width:16px; height:16px; border:2.5px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .55s linear infinite; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── EMPTY ── */
.empty { text-align:center; padding:32px 12px; color:var(--muted); }
.empty i { font-size:42px; display:block; margin-bottom:10px; color:var(--border); }
.empty p { font-size:13px; }

/* ── STRIP ── */
.strip { background:linear-gradient(135deg,var(--green),var(--blue)); border-radius:var(--r); padding:16px 20px; color:#fff; margin-bottom:14px; display:flex; justify-content:space-around; flex-wrap:wrap; gap:12px; }
.sv { font-size:24px; font-weight:800; }
.sl { font-size:11px; opacity:.8; margin-top:1px; }

/* ── BUDGET BAR ── */
.budget { background:#E1F5EE; border:2px solid var(--green); border-radius:var(--rs); padding:12px 16px; display:flex; gap:20px; flex-wrap:wrap; margin-bottom:14px; }
.budget-item { font-size:13px; color:var(--green-dark); }
.budget-item strong { font-weight:800; }
.budget-item.over strong { color:var(--red); }

/* ── HISTORY TABLE ── */
.htable { width:100%; border-collapse:collapse; font-size:12px; }
.htable th { text-align:left; padding:8px 10px; color:var(--muted); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.4px; border-bottom:2px solid var(--border); }
.htable td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
.htable tr:last-child td { border-bottom:none; }
.htable tr:hover td { background:var(--bg); }

/* ── SUGGEST BTNS ── */
.sbgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.sbt { padding:18px 10px; border-radius:var(--r); border:2px solid var(--border); background:#fff; cursor:pointer; text-align:center; font-family:inherit; transition:all .18s; }
.sbt i { font-size:30px; display:block; margin-bottom:7px; color:var(--muted); }
.sbt span { font-size:12px; font-weight:700; color:var(--muted); display:block; }
.sbt:hover,.sbt.on { border-color:var(--green); background:#E1F5EE; }
.sbt:hover i,.sbt.on i { color:var(--green); }
.sbt:hover span,.sbt.on span { color:var(--green-dark); }

/* ── STAT PILLS ── */
.pills { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
.pill { display:inline-flex; align-items:center; gap:5px; background:var(--bg); border:1.5px solid var(--border); border-radius:20px; padding:5px 12px; font-size:12px; font-weight:700; }

/* ── TOAST ── */
.toast { position:fixed; bottom:20px; right:20px; background:var(--text); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); z-index:9999; transform:translateY(80px); transition:transform .28s; display:flex; align-items:center; gap:8px; }
.toast.show { transform:translateY(0); }
.toast.green { background:var(--green); }

/* ── WGT HISTORY ── */
.wrow { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); }
.wrow:last-child { border-bottom:none; }

/* ── NOTICE BOX ── */
.notice { border-radius:var(--rs); padding:12px 14px; font-size:13px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.notice-a { background:var(--amber-light); color:var(--amber-dark); border:2px solid var(--amber); }
.notice-b { background:var(--blue-light); color:var(--blue-dark); border:2px solid var(--blue); }

hr { border:none; border-top:1px solid var(--border); margin:14px 0; }

/* sync status dot */
.sync-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.sync-dot.on { background:var(--green); }
.sync-dot.off { background:var(--subtle); }
.sync-dot.busy { background:var(--amber); animation:pulse 1s infinite; }
@keyframes pulse { 50% { opacity:.3; } }
.sync-bar { display:flex; align-items:center; gap:7px; padding:8px 12px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); cursor:pointer; }
.sync-bar:hover { background:var(--bg); }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- ═══ PROFILE PICKER ═══ -->
<div id="scr-profiles" class="screen active">
  <div class="profiles-box">
    <div class="app-brand">
      <div class="brand-icon"><i class="ti ti-heartbeat"></i></div>
      <div class="brand-name">FitTrack</div>
    </div>
    <div class="brand-tagline">Your personal health & fitness companion</div>
    <div class="pgrid" id="pgrid"></div>
  </div>
</div>

<!-- ═══ NEW PROFILE ═══ -->
<div id="scr-new" class="screen">
  <div class="form-hdr">
    <button class="back-btn" onclick="goScr('profiles')"><i class="ti ti-arrow-left"></i></button>
    <h1>Create your profile</h1>
  </div>
  <div class="form-body">

    <div class="fsec">
      <div class="fsec-title"><i class="ti ti-user"></i> Personal details</div>
      <div class="fg2">
        <div class="fg"><label>Full name</label><input id="np-name" placeholder="e.g. Arjun Sharma"></div>
        <div class="fg"><label>Age</label><input id="np-age" type="number" placeholder="28" min="10" max="100"></div>
      </div>
      <div class="fg2">
        <div class="fg"><label>Height (cm)</label><input id="np-ht" type="number" placeholder="170"></div>
        <div class="fg"><label>Current weight (kg)</label><input id="np-wt" type="number" placeholder="68" step="0.1"></div>
      </div>
      <div class="fg2">
        <div class="fg"><label>Sex (for BMR calculation)</label>
          <select id="np-sex"><option>Male</option><option>Female</option><option>Other</option></select>
        </div>
        <div class="fg"><label>Activity level</label>
          <select id="np-act">
            <option value="1.2">Sedentary — desk job, little/no exercise</option>
            <option value="1.375">Light — 1–3 days/week</option>
            <option value="1.55" selected>Moderate — 3–5 days/week</option>
            <option value="1.725">Active — 6–7 days/week</option>
            <option value="1.9">Very active — athlete / physical job</option>
          </select>
        </div>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-title"><i class="ti ti-target"></i> Your primary goal</div>
      <div class="chips" id="goal-chips">
        <button class="chip" onclick="selGoal(this)">Lose weight</button>
        <button class="chip on" onclick="selGoal(this)">Maintain weight</button>
        <button class="chip" onclick="selGoal(this)">Build muscle</button>
        <button class="chip" onclick="selGoal(this)">Improve overall health</button>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-title"><i class="ti ti-salad"></i> Diet preference</div>
      <div class="chips" id="diet-chips">
        <button class="chip on" onclick="selDiet(this)">Non-vegetarian</button>
        <button class="chip" onclick="selDiet(this)">Vegetarian</button>
        <button class="chip" onclick="selDiet(this)">Vegan</button>
        <button class="chip" onclick="selDiet(this)">Pescatarian</button>
        <button class="chip" onclick="selDiet(this)">Keto</button>
        <button class="chip" onclick="selDiet(this)">Paleo</button>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-title"><i class="ti ti-alert-triangle"></i> Allergies / foods to avoid</div>
      <div class="chips" id="allergy-chips">
        <button class="chip" onclick="this.classList.toggle('on-red')">Nuts</button>
        <button class="chip" onclick="this.classList.toggle('on-red')">Dairy</button>
        <button class="chip" onclick="this.classList.toggle('on-red')">Gluten</button>
        <button class="chip" onclick="this.classList.toggle('on-red')">Eggs</button>

<script>
/* ── CONFIG: GOOGLE GEMINI (FREE) ───────────────────────── */
// This app uses Google's Gemini API, which has a generous FREE tier
// (1,500 requests/day, no credit card). Get a free key at:
//   https://aistudio.google.com/apikey
// The key is stored ONLY in your browser (localStorage) — never sent anywhere
// except directly to Google. Gemini allows browser calls, so no backend needed.
const GEMINI_MODEL = 'gemini-2.5-flash';

function getApiKey() {
  return localStorage.getItem('gemini_key') || '';
}
function setApiKey(k) {
  localStorage.setItem('gemini_key', k.trim());
}

// Calls Gemini but RETURNS an Anthropic-shaped object {content:[{text}]}
// so the rest of the app code doesn't need to change.
async function callAI(messages, max_tokens = 800) {
  const key = getApiKey();
  if (!key) {
    return { error: { message: 'No Gemini API key set. Open Settings (gear icon) to add your free key.' } };
  }
  // Convert our simple {role, content} messages into Gemini's format.
  const contents = messages.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }],
  }));
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`;
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents,
        generationConfig: { maxOutputTokens: max_tokens, temperature: 0.7 },
      }),
    });
    const data = await r.json();
    if (data.error) {
      return { error: { message: data.error.message || 'Gemini API error' } };
    }
    const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
    if (!text) {
      return { error: { message: 'Gemini returned an empty response. Try again.' } };
    }
    return { content: [{ text }] };
  } catch (e) {
    return { error: { message: e.message || 'Network error calling Gemini.' } };
  }
}

/* ══════════ GOOGLE DRIVE SYNC ══════════ */
// Stores all data in a private "app data folder" on the user's Google Drive
// (scope drive.appdata) — only this app can read/write it. Syncs across devices.
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILENAME = 'fittrack-data.json';
let tokenClient = null;
let accessToken = null;
let tokenExpiry = 0;
let driveFileId = null;
let syncTimer = null;
let syncing = false;

function getClientId() { return localStorage.getItem('gdrive_client_id') || ''; }
function setClientId(v) { localStorage.setItem('gdrive_client_id', v.trim()); }
function driveEnabled() { return localStorage.getItem('gdrive_enabled') === '1'; }
function setDriveEnabled(v) { localStorage.setItem('gdrive_enabled', v ? '1' : '0'); }
function lastSync() { return localStorage.getItem('gdrive_last_sync') || ''; }

function setSyncStatus(state, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (dot) dot.className = 'sync-dot ' + state;
  if (txt) txt.textContent = text;
}

function initTokenClient() {
  const cid = getClientId();
  if (!cid) throw new Error('No Google OAuth Client ID set.');
  if (!window.google?.accounts?.oauth2) throw new Error('Google library still loading — try again in a moment.');
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: DRIVE_SCOPE,
    callback: () => {}, // set per-request
  });
}

function getToken(interactive) {
  return new Promise((resolve, reject) => {
    if (accessToken && Date.now() < tokenExpiry - 60000) return resolve(accessToken);
    try { if (!tokenClient) initTokenClient(); } catch (e) { return reject(e); }
    tokenClient.callback = (resp) => {
      if (resp.error) return reject(new Error(resp.error));
      accessToken = resp.access_token;
      tokenExpiry = Date.now() + (resp.expires_in || 3600) * 1000;
      resolve(accessToken);
    };
    try {
      tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
    } catch (e) { reject(e); }
  });
}

async function driveFindFile(token) {
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}'`);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`, {
    headers: { Authorization: 'Bearer ' + token },
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.files && d.files[0] ? d.files[0].id : null;
}

async function driveDownload(token, id) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, {
    headers: { Authorization: 'Bearer ' + token },
  });
  if (!r.ok) throw new Error('Download failed (' + r.status + ')');
  return r.json();
}

async function driveUpload(token, id, data) {
  const json = JSON.stringify(data);
  if (id) {
    const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: json,
    });
    if (!r.ok) throw new Error('Upload failed (' + r.status + ')');
    return id;
  } else {
    const boundary = 'fittrack_boundary_' + Date.now();
    const meta = { name: DRIVE_FILENAME, parents: ['appDataFolder'] };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`;
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body,
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    return d.id;
  }
}

// Merge two states without losing data. Granularity: per profile, per day.
function mergeStates(a, b) {
  // a = local, b = remote. Returns merged.
  if (!a) return b; if (!b) return a;
  const out = { profiles: [], data: {}, current: a.current || b.current, updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0) };
  // profiles: union by id, prefer the version from the newer doc
  const aNewer = (a.updatedAt || 0) >= (b.updatedAt || 0);
  const byId = {};
  (aNewer ? b.profiles : a.profiles).forEach(p => byId[p.id] = p);
  (aNewer ? a.profiles : b.profiles).forEach(p => byId[p.id] = p); // newer overwrites
  out.profiles = Object.values(byId);
  // data: per profile, per day
  const pids = new Set([...Object.keys(a.data || {}), ...Object.keys(b.data || {})]);
  pids.forEach(pid => {
    const ad = (a.data?.[pid]?.days) || {};
    const bd = (b.data?.[pid]?.days) || {};
    const days = {};
    const dates = new Set([...Object.keys(ad), ...Object.keys(bd)]);
    dates.forEach(dt => {
      const ax = ad[dt], bx = bd[dt];
      if (!ax) { days[dt] = bx; return; }
      if (!bx) { days[dt] = ax; return; }
      // both have this day — pick the richer one (more entries), tiebreak by newer doc
      const an = (ax.food?.length || 0) + (ax.exercise?.length || 0) + (ax.weight ? 1 : 0);
      const bn = (bx.food?.length || 0) + (bx.exercise?.length || 0) + (bx.weight ? 1 : 0);
      if (an > bn) days[dt] = ax;
      else if (bn > an) days[dt] = bx;
      else days[dt] = aNewer ? ax : bx;
    });
    out.data[pid] = { days };
  });
  return out;
}

async function driveSyncNow(interactive) {
  if (!driveEnabled() || !getClientId()) return;
  if (syncing) return;
  syncing = true;
  setSyncStatus('busy', 'Syncing…');
  try {
    const token = await getToken(interactive);
    if (!driveFileId) driveFileId = await driveFindFile(token);
    let remote = null;
    if (driveFileId) {
      try { remote = await driveDownload(token, driveFileId); } catch (e) { remote = null; }
    }
    const merged = mergeStates(S, remote);
    S = merged;
    try { localStorage.setItem('ft4', JSON.stringify(S)); } catch (e) {}
    driveFileId = await driveUpload(token, driveFileId, S);
    const now = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    localStorage.setItem('gdrive_last_sync', now);
    setSyncStatus('on', 'Synced ' + now);
    // refresh current view so merged data appears
    if (S.current && document.getElementById('scr-app').classList.contains('active')) {
      nav(activePage, null);
    }
    return true;
  } catch (e) {
    setSyncStatus('off', 'Sync error');
    if (interactive) alert('Sync failed: ' + (e.message || e));
    return false;
  } finally {
    syncing = false;
  }
}

function scheduleDriveSync() {
  if (!driveEnabled() || !getClientId()) return;
  clearTimeout(syncTimer);
  setSyncStatus('busy', 'Saving…');
  syncTimer = setTimeout(() => driveSyncNow(false), 2500);
}

/* ── STATE ──────────────────────────────────────────────── */
let S = { profiles: [], current: null, data: {} };
let viewDate = tday();
let activePage = 'dashboard';

function tday() { return new Date().toISOString().split('T')[0]; }
function fmtFull(d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }); }
function fmtS(d) {
  const t = tday();
  const y = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  if (d === t) return 'Today';
  if (d === y) return 'Yesterday';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem('ft4', JSON.stringify(S)); } catch (e) {}
  try { if (window.storage) window.storage.set('ft4', JSON.stringify(S)); } catch (e) {}
  scheduleDriveSync();
}
async function load() {
  try { const s = localStorage.getItem('ft4'); if (s) S = JSON.parse(s); } catch (e) {}
  try { if (window.storage) { const r = await window.storage.get('ft4'); if (r?.value) S = JSON.parse(r.value); } } catch (e) {}
}

function dayOf(pid, dt) {
  if (!S.data[pid]) S.data[pid] = { days: {} };
  if (!S.data[pid].days[dt]) S.data[pid].days[dt] = { food: [], exercise: [], weight: null };
  return S.data[pid].days[dt];
}
function cur() { return dayOf(S.current, viewDate); }
function prof() { return S.profiles.find(p => p.id === S.current) || {}; }
function lastWt() {
  const d = S.data[S.current]; if (!d) return null;
  for (const dt of Object.keys(d.days).sort().reverse()) if (d.days[dt].weight) return d.days[dt].weight;
  return null;
}
function bmiVal() { const p = prof(), w = lastWt(); if (!w || !p.height) return null; return (w / (p.height / 100) ** 2).toFixed(1); }
function bmiCat(b) {
  b = parseFloat(b);
  if (b < 18.5) return { l: 'Underweight', c: 'bg-b' };
  if (b < 25)   return { l: 'Normal weight', c: 'bg-g' };
  if (b < 30)   return { l: 'Overweight', c: 'bg-a' };
  return { l: 'Obese', c: 'bg-r' };
}
const COLS = ['#1D9E75','#185FA5','#D85A30','#BA7517','#993556','#534AB7'];
function colFor(i) { return COLS[i % COLS.length]; }
function inits(n) { return (n || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2); }
function showToast(msg, cls = '') {
  const el = document.getElementById('toast'); el.textContent = msg;
  el.className = 'toast show ' + cls; clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

let goalSel = 'Maintain weight', dietSel = 'Non-vegetarian';
function selGoal(el) { document.querySelectorAll('#goal-chips .chip').forEach(c => c.classList.remove('on')); el.classList.add('on'); goalSel = el.textContent.trim(); }
function selDiet(el) { document.querySelectorAll('#diet-chips .chip').forEach(c => c.classList.remove('on')); el.classList.add('on'); dietSel = el.textContent.trim(); }

/* ── SCREENS ── */
function goScr(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('scr-' + name).classList.add('active');
  if (name === 'profiles') renderProfiles();
}

/* ── PROFILES ── */
function renderProfiles() {
  const g = document.getElementById('pgrid');
  g.innerHTML = S.profiles.map((p, i) =>
    `<div class="ptile" onclick="selProf('${p.id}')">
       <div class="pav" style="background:${colFor(i)}">${inits(p.name)}</div>
       <div class="pn">${p.name}</div><div class="pg">${p.goal || ''}</div>
     </div>`
  ).join('') +
  `<div class="ptile add-ptile" onclick="goScr('new')">
     <i class="ti ti-plus"></i><span>Add profile</span>
   </div>`;
}

function createProfile() {
  const name = document.getElementById('np-name').value.trim();
  if (!name) { alert('Please enter your name.'); return; }
  const age = parseInt(document.getElementById('np-age').value) || 25;
  const height = parseFloat(document.getElementById('np-ht').value) || 170;
  const weight = parseFloat(document.getElementById('np-wt').value) || 70;
  const sex = document.getElementById('np-sex').value;
  const act = parseFloat(document.getElementById('np-act').value) || 1.55;
  const allergies = Array.from(document.querySelectorAll('#allergy-chips .chip.on-red')).map(c => c.textContent.trim());
  const bmr = sex === 'Male'
    ? 88.362 + 13.397 * weight + 4.799 * height - 5.677 * age
    : 447.593 + 9.247 * weight + 3.098 * height - 4.330 * age;
  const tdee = Math.round(bmr * act);
  let calTarget = tdee;
  if (goalSel === 'Lose weight') calTarget = Math.round(tdee - 500);
  else if (goalSel === 'Build muscle') calTarget = Math.round(tdee + 300);
  const id = 'p' + Date.now();
  const p = { id, name, age, height, weight, sex, act, goal: goalSel, diet: dietSel, allergies, calTarget, tdee };
  S.profiles.push(p);
  S.data[id] = { days: {} };
  dayOf(id, tday()).weight = weight;
  save(); selProf(id);
}

function selProf(pid) {
  S.current = pid; save(); viewDate = tday();
  const p = prof(), i = S.profiles.findIndex(x => x.id === pid);
  const av = document.getElementById('sb-av');
  av.textContent = inits(p.name); av.style.background = colFor(i);
  document.getElementById('sb-name').textContent = p.name;
  updDate(); goScr('app');
  if (!getApiKey()) {
    nav('settings', null);
    document.querySelectorAll('.nb').forEach(b => { if (b.textContent.includes('AI settings')) b.classList.add('on'); });
    showToast('👋 Add your free Gemini key to enable AI features');
  } else {
    nav('dashboard', document.querySelector('.nb'));
  }
}

/* ── NAV ── */
function nav(page, btn) {
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  else document.querySelectorAll('.nb').forEach(b => { if (b.textContent.toLowerCase().includes(page)) b.classList.add('on'); });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  activePage = page;
  ({ dashboard: renderDash, food: renderFood, exercise: renderEx, weight: renderWt, suggest: renderSuggest, history: renderHist, profile: renderProfile, settings: renderSettings, cloud: renderCloud })[page]?.();
}

function shiftDate(d) {
  const dt = new Date(viewDate + 'T12:00:00'); dt.setDate(dt.getDate() + d);
  const nd = dt.toISOString().split('T')[0]; if (nd > tday()) return;
  viewDate = nd; updDate(); nav(activePage, null);
}
function updDate() { document.getElementById('dval').textContent = fmtS(viewDate); }

/* ══════════ DASHBOARD ══════════ */
function renderDash() {
  const d = cur(), p = prof();
  const calIn  = d.food.reduce((s, f) => s + (f.calories || 0), 0);
  const calOut = d.exercise.reduce((s, e) => s + (e.calBurned || 0), 0);
  const net = calIn - calOut;
  const tgt = p.calTarget || 2000;
  const pct = Math.min(100, Math.round(calIn / tgt * 100));
  const exMin = d.exercise.reduce((s, e) => s + (e.duration || 0), 0);
  const bmi = bmiVal(), bc = bmi ? bmiCat(bmi) : null;
  const isToday = viewDate === tday();
  const MEAL_ICONS = { Breakfast: '🌅', Lunch: '☀️', Dinner: '🌙', Snack: '🍎' };

  document.getElementById('page-dashboard').innerHTML = `
    <div class="ph">
      <h2>${isToday ? '👋 Today\'s overview' : '📅 ' + fmtFull(viewDate)}</h2>
      <p>${p.name || ''} · ${p.goal || 'No goal'} · Target: <strong>${tgt.toLocaleString()} kcal/day</strong></p>
    </div>

    <div class="mrow">
      <div class="mc ${calIn > tgt ? 'r' : 'g'}">
        <div class="ml">🍽 Calories in</div>
        <div class="mv" style="color:${calIn > tgt ? 'var(--red)' : 'inherit'}">${calIn.toLocaleString()}</div>
        <div class="ms">of ${tgt.toLocaleString()} kcal</div>
        <div class="ptrack"><div class="pfill" style="width:${pct}%;background:${pct > 110 ? 'var(--red)' : pct > 90 ? 'var(--amber)' : 'var(--green)'}"></div></div>
      </div>
      <div class="mc g">
        <div class="ml">🏃 Burned</div>
        <div class="mv" style="color:var(--green)">${calOut}</div>
        <div class="ms">${exMin} min exercise</div>
      </div>
      <div class="mc ${net > tgt ? 'r' : 'b'}">
        <div class="ml">⚖️ Net calories</div>
        <div class="mv" style="color:${net > tgt ? 'var(--red)' : 'var(--blue)'}">${net.toLocaleString()}</div>
        <div class="ms">${net <= tgt ? '✓ On track' : '↑ Over budget'}</div>
      </div>
    </div>

    ${bmi ? `<div class="mrow mrow2">
      <div class="mc ${bc.c.replace('bg-', '')}">
        <div class="ml">📊 BMI</div>
        <div class="mv">${bmi}</div>
        <div class="ms"><span class="bg ${bc.c}">${bc.l}</span></div>
        <div class="bmi-wrap">
          <div class="bmi-bar"><div class="bmi-pin" style="left:${Math.min(94, Math.max(2, (parseFloat(bmi)-15)/25*100)).toFixed(1)}%"></div></div>
          <div class="bmi-leg"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div>
        </div>
      </div>
      <div class="mc b">
        <div class="ml">🎯 Remaining today</div>
        <div class="mv" style="color:${tgt-calIn < 0 ? 'var(--red)' : 'var(--blue)'}">${(tgt - calIn).toLocaleString()}</div>
        <div class="ms">kcal left in budget</div>
        <div style="margin-top:8px;font-size:11px;color:var(--muted)">TDEE: ${p.tdee || tgt} · ${p.diet || ''}</div>
      </div>
    </div>` : ''}

    <div class="card">
      <div class="ch">
        <div class="ct"><i class="ti ti-apple"></i> Today's food</div>
        ${isToday ? `<button class="btn btn-p btn-sm" onclick="nav('food',null)"><i class="ti ti-plus"></i> Add food</button>` : ''}
      </div>
      ${d.food.length === 0
        ? `<div class="empty"><i class="ti ti-apple"></i><p>${isToday ? 'Tap "Add food" to log your meals' : 'No food logged this day'}</p></div>`
        : ['Breakfast','Lunch','Dinner','Snack'].map(meal => {

function toggleManual(id) {
  const el = document.getElementById(id);

}

async function lookupFood() {
  const name = document.getElementById('fi-name').value.trim();
  const qty  = document.getElementById('fi-qty').value.trim();
  if (!name) { alert('Please describe what you ate.'); return; }
  const el = document.getElementById('food-result');
  el.innerHTML = `<div class="loading"><div class="spin"></div> Looking up <strong>${name}</strong>…</div>`;

  // Build a natural-language query that Claude can understand well
  const query = qty ? `${name}, ${qty}` : name;
  const prompt = `You are a nutrition expert. The user ate: "${query}"

Estimate the nutritional content. Be smart about interpreting common descriptions:
- "1 plate" of rice = approximately 200g cooked rice
- "1 bowl" = roughly 250ml
- Vague quantities like "some", "a bit" = use a standard single serving
- Indian, Asian, Western foods — use realistic regional portion sizes

Return ONLY a valid JSON object, no markdown fences, no explanation before or after:
{"name":"friendly food name","serving":"exact serving description","calories":integer,"protein":integer,"carbs":integer,"fat":integer,"fiber":integer}

All numbers must be integers. Be accurate.`;

  try {
    const data = await callAI([{ role: 'user', content: prompt }], 200);
    if (data.error) throw new Error(data.error.message || data.error);
    let txt = (data.content?.[0]?.text || '{}').replace(/```json|```/g, '').trim();
    // extract JSON if there's extra text
    const m = txt.match(/\{[\s\S]*\}/);
    if (m) txt = m[0];
    const f = JSON.parse(txt);
    el.innerHTML = `
      <div class="rbox">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div>
            <div class="rbox-name">${f.name}</div>
            <div style="font-size:12px;color:var(--green-dark);margin-bottom:8px">${f.serving}</div>
            <div class="macros">
              <span class="mac">🥩 Protein: ${f.protein}g</span>
              <span class="mac">🍚 Carbs: ${f.carbs}g</span>
              <span class="mac">🧈 Fat: ${f.fat}g</span>
              <span class="mac">🌿 Fiber: ${f.fiber||0}g</span>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div class="rbox-cal">${f.calories}</div>
            <div style="font-size:12px;color:var(--green-dark)">kcal</div>
          </div>
        </div>
        <div class="bgrp" style="margin-top:14px">
          <button class="btn btn-p" onclick='confirmFood(${JSON.stringify(f).replace(/'/g,"&#39;")})'><i class="ti ti-check"></i> Add to log</button>
          <button class="btn btn-o btn-sm" onclick="document.getElementById('food-result').innerHTML=''">Dismiss</button>
        </div>
      </div>`;
  } catch (err) {
    el.innerHTML = `
      <div class="rbox rbox-r">
        <div class="rbox-name rbox-name-r">Could not look up nutrition</div>
        <p style="font-size:12px;color:var(--red-dark);margin:6px 0 10px">${err.message || 'Check your connection or enter values manually.'}</p>
        <button class="btn btn-o btn-sm" onclick="toggleManual('manual-food')">Enter manually instead</button>
      </div>`;
  }
}

function confirmFood(food) {
  if (typeof food === 'string') food = JSON.parse(food);
  food.meal = document.getElementById('fi-meal').value;
  cur().food.push(food); save();
  document.getElementById('fi-name').value = '';
  document.getElementById('fi-qty').value = '';
  document.getElementById('food-result').innerHTML = '';
  showToast('✅ ' + food.name + ' added!', 'green');
  renderFood();
}

function addFoodManual() {
  const name = document.getElementById('fi-name').value.trim() || 'Custom food';
  const qty  = document.getElementById('fi-qty').value.trim() || '1 serving';
  const food = {
    name, serving: qty,
    meal: document.getElementById('fi-meal').value,
    calories: parseInt(document.getElementById('fm-cal').value) || 0,
    protein:  parseInt(document.getElementById('fm-pro').value) || 0,
    carbs:    parseInt(document.getElementById('fm-carb').value) || 0,
    fat:      parseInt(document.getElementById('fm-fat').value) || 0,
  };
  cur().food.push(food); save();
  document.getElementById('fi-name').value = '';
  document.getElementById('manual-food').style.display = 'none';
  showToast('✅ ' + name + ' added!', 'green');
  renderFood();
}

function removeFood(idx) { cur().food.splice(idx, 1); save(); showToast('Removed'); renderFood(); }

async function lookupEx() {
  const name = document.getElementById('ex-name').value.trim();
  const dur  = parseInt(document.getElementById('ex-dur').value) || 30;
  const intens = document.getElementById('ex-int').value;
  if (!name) { alert('Enter an exercise name.'); return; }
  const w = lastWt() || prof().weight || 70;
  const el = document.getElementById('ex-result');
  el.innerHTML = `<div class="loading"><div class="spin"></div> Calculating calories for <strong>${name}</strong>…</div>`;

  const prompt = `You are a fitness expert. Estimate calories burned for: "${name}", ${dur} minutes, ${intens} intensity, body weight: ${w}kg.
Return ONLY valid JSON, no markdown:
{"calBurned":integer,"met":number,"tip":"one practical tip about this exercise in under 20 words"}`;

  try {
    const data = await callAI([{ role: 'user', content: prompt }], 150);
    if (data.error) throw new Error(data.error.message || data.error);
    let txt = (data.content?.[0]?.text || '{}').replace(/```json|```/g, '').trim();
    const m = txt.match(/\{[\s\S]*\}/); if (m) txt = m[0];
    const ex = JSON.parse(txt);
    el.innerHTML = `
      <div class="rbox">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div>
            <div class="rbox-name">${name}</div>
            <div style="font-size:12px;color:var(--green-dark);margin-bottom:6px">${dur} minutes · ${intens} intensity</div>
            ${ex.tip ? `<div style="font-size:12px;color:var(--green-dark);background:rgba(255,255,255,.6);padding:6px 10px;border-radius:6px;margin-top:6px">💡 ${ex.tip}</div>` : ''}
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div class="rbox-cal">-${ex.calBurned}</div>
            <div style="font-size:12px;color:var(--green-dark)">kcal burned</div>

        </div>
        <div class="bgrp" style="margin-top:14px">
          <button class="btn btn-p" onclick="confirmEx('${name.replace(/'/g,"\\'")}',${dur},'${intens}',${ex.calBurned})"><i class="ti ti-check"></i> Add to log</button>

  }
}

function confirmEx(name, duration, intensity, calBurned) {
  const notes = document.getElementById('ex-notes').value.trim();
  cur().exercise.push({ name, duration, intensity, calBurned, notes }); save();
  document.getElementById('ex-name').value = '';
  document.getElementById('ex-dur').value = '';
  document.getElementById('ex-notes').value = '';

  showToast('✅ ' + name + ' logged!', 'green');
  renderEx();
}
function addExManual() {
  const name = document.getElementById('ex-name').value.trim() || 'Exercise';

  const intens = document.getElementById('ex-int').value;

  const notes = document.getElementById('ex-notes').value.trim();

function removeEx(i) { cur().exercise.splice(i,1); save(); showToast('Removed'); renderEx(); }

/* ══════════ WEIGHT ══════════ */
function renderWt() {
  const p = prof(), bmi = bmiVal(), bc = bmi ? bmiCat(bmi) : null;
  const d = S.data[S.current] || { days:{} };
  const hist = Object.keys(d.days).sort().filter(dt => d.days[dt].weight).map(dt => ({ dt, w: d.days[dt].weight }));
  const isToday = viewDate === tday();

  document.getElementById('page-weight').innerHTML = `
    <div class="ph"><h2>⚖️ Weight &amp; BMI</h2><p>Track your weight and monitor BMI over time</p></div>

    ${isToday ? `
    <div class="card">
      <div class="ct" style="margin-bottom:14px"><i class="ti ti-scale"></i> Log today's weight</div>
      <div class="fg2">
        <div class="fg"><label>Weight (kg)</label><input id="w-val" type="number" step="0.1" placeholder="${lastWt()||70}" value="${cur().weight||''}"></div>
        <div class="fg"><label>Height (cm)</label><input id="w-ht" type="number" value="${p.height||''}" placeholder="170"></div>
      </div>
      <button class="btn btn-p" onclick="saveWt()"><i class="ti ti-check"></i> Save weight</button>
    </div>` : ''}

    ${bmi ? `
    <div class="mrow">
      <div class="mc ${bc.c.replace('bg-','')}">
        <div class="ml">BMI</div><div class="mv">${bmi}</div>
        <div class="ms"><span class="bg ${bc.c}">${bc.l}</span></div>
      </div>
      <div class="mc g">
        <div class="ml">Current weight</div><div class="mv">${lastWt()} <span style="font-size:14px;font-weight:400">kg</span></div>
        <div class="ms">Height: ${p.height} cm</div>
      </div>
      <div class="mc b">
        <div class="ml">Healthy range</div>
        <div class="mv" style="font-size:18px">${(18.5*(p.height/100)**2).toFixed(0)}–${(24.9*(p.height/100)**2).toFixed(0)}</div>
        <div class="ms">kg for your height</div>
      </div>
    </div>
    <div class="card">
      <div class="ct" style="margin-bottom:12px"><i class="ti ti-chart-line"></i> BMI scale</div>
      <div class="bmi-wrap">
        <div class="bmi-bar"><div class="bmi-pin" style="left:${Math.min(94,Math.max(2,(parseFloat(bmi)-15)/25*100)).toFixed(1)}%"></div></div>
        <div class="bmi-leg"><span>15 Underweight</span><span>18.5 Normal</span><span>25 Overweight</span><span>30 Obese</span><span>40+</span></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <div class="pill">BMI ${bmi} — ${bc.l}</div>
        <div class="pill">Height ${p.height}cm · Weight ${lastWt()}kg</div>
      </div>
    </div>` : `<div class="notice notice-b"><i class="ti ti-info-circle" style="font-size:18px"></i> Log your weight above to see your BMI calculation.</div>`}

    <div class="card">
      <div class="ch"><div class="ct"><i class="ti ti-trending-up"></i> Weight history</div><span class="bg bg-b">${hist.length} entries</span></div>
      ${hist.length === 0
        ? `<div class="empty"><i class="ti ti-scale"></i><p>No weight entries yet</p></div>`
        : hist.slice(-15).reverse().map((w,i,arr) => {
            const prev = arr[i+1];
            const delta = prev ? (w.w - prev.w).toFixed(1) : null;
            const bw = p.height ? (w.w/(p.height/100)**2).toFixed(1) : null;
            return `<div class="wrow">
              <div><div style="font-size:13px;font-weight:600">${fmtFull(w.dt)}</div>${bw?`<div style="font-size:11px;color:var(--muted)">BMI ${bw}</div>`:''}</div>
              <div style="display:flex;align-items:center;gap:10px">
                ${delta!==null?`<span style="font-size:12px;font-weight:700;color:${parseFloat(delta)>0?'var(--red)':parseFloat(delta)<0?'var(--green)':'var(--muted)'}">${parseFloat(delta)>0?'▲':parseFloat(delta)<0?'▼':'='} ${Math.abs(delta)}kg</span>`:''}
                <span style="font-size:16px;font-weight:800">${w.w} kg</span>
              </div>
            </div>`;
          }).join('')}
    </div>`;
}

function saveWt() {
  const v = parseFloat(document.getElementById('w-val').value);
  if (!v || v < 20 || v > 300) { alert('Enter a valid weight (20–300 kg)'); return; }
  const htEl = document.getElementById('w-ht');
  if (htEl?.value) { prof().height = parseFloat(htEl.value); }
  cur().weight = v; save();
  showToast('✅ Weight saved!', 'green'); renderWt();
}

        ${bmi?`<div class="pill">📊 BMI: ${bmi}</div>`:''}
        ${w?`<div class="pill">⚖️ ${w}kg</div>`:''}
        ${p.allergies?.length?`<div class="pill" style="border-color:var(--red);color:var(--red-dark)">⚠️ Avoids: ${p.allergies.join(', ')}</div>`:''}
      </div>
    </div>
    <div class="sbgrid">
      <div class="sbt" onclick="getSug('all',this)"><i class="ti ti-sparkles"></i><span>Full health advice</span></div>
      <div class="sbt" onclick="getSug('meal',this)"><i class="ti ti-apple"></i><span>What to eat today</span></div>
      <div class="sbt" onclick="getSug('workout',this)"><i class="ti ti-barbell"></i><span>Workout plan</span></div>
    </div>
    <div id="sug-out"></div>`;
}

async function getSug(type, btn) {
  document.querySelectorAll('.sbt').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  const p = prof(), d = cur(), bmi = bmiVal(), w = lastWt();
  const calIn  = d.food.reduce((s,f)=>s+(f.calories||0),0);
  const exMin  = d.exercise.reduce((s,e)=>s+(e.duration||0),0);
  const calOut = d.exercise.reduce((s,e)=>s+(e.calBurned||0),0);
  const el = document.getElementById('sug-out');
  el.innerHTML = `<div class="card"><div class="loading"><div class="spin"></div> Your AI health coach is analysing your data…</div></div>`;

  const ctx = `Profile: ${p.name}, ${p.age}y, ${p.sex}, Height: ${p.height}cm, Weight: ${w||'?'}kg, BMI: ${bmi||'?'}
Goal: ${p.goal} | Diet: ${p.diet} | Allergies/avoid: ${p.allergies?.join(', ')||'none'}
TDEE: ${p.tdee} kcal | Daily target: ${p.calTarget} kcal
Today (${fmtFull(viewDate)}): ${calIn} kcal consumed — foods: ${d.food.map(f=>f.name).join(', ')||'none'}
Exercise today: ${exMin} min / ${calOut} kcal burned — activities: ${d.exercise.map(e=>e.name).join(', ')||'none'}`;

  const prompts = {
    meal: `${ctx}\n\nYou are a friendly nutritionist. Create a practical full-day meal plan for this person. Respect their diet (${p.diet}) and avoid: ${p.allergies?.join(', ')||'nothing'}. Include specific foods with approximate calories per meal. Total ≈ ${p.calTarget} kcal. Be realistic, use everyday foods.`,
    workout: `${ctx}\n\nYou are a personal trainer. Create a specific weekly workout plan to help them reach their goal (${p.goal}). Include exercises with sets/reps or durations, recommended days/week, warm-up tips. Adjust for their BMI and activity level. Be motivating.`,
    all: `${ctx}\n\nYou are a holistic health coach. Give personalised suggestions covering:
1. 🍽 Diet — specific foods to eat more/less of, foods that match their goal
2. 🏃 Exercise — what activities and how often
3. ⚖️ Weight/BMI — what to focus on
4. 💪 3–4 daily habits that will make the biggest difference
5. 🎯 One concrete action to start TODAY

Respect diet (${p.diet}) and allergies. Be friendly, specific, and motivating. Use clear numbered sections.`
  };

  try {
    const data = await callAI([{ role:'user', content: prompts[type] }], 900);
    if (data.error) throw new Error(data.error.message || data.error);
    const text = data.content?.[0]?.text || 'Could not get suggestions.';
    el.innerHTML = `<div class="card"><div class="ai-out">${text}</div><div class="bgrp" style="margin-top:12px"><button class="btn btn-o btn-sm" onclick="getSug('${type}',null)"><i class="ti ti-refresh"></i> Refresh</button></div></div>`;
  } catch (err) {
    el.innerHTML = `<div class="card"><p style="color:var(--red);font-size:13px">Failed: ${err.message||'Check connection.'}</p><button class="btn btn-o btn-sm" style="margin-top:10px" onclick="getSug('${type}',null)">Retry</button></div>`;
  }
}

/* ══════════ HISTORY ══════════ */
function renderHist() {
  const d = S.data[S.current] || { days:{} };
  const p = prof();
  const dates = Object.keys(d.days).sort().reverse().slice(0, 60);
  const l7 = Object.keys(d.days).sort().reverse().slice(0, 7);
  const avgCal = (() => { const dd=l7.filter(dt=>d.days[dt].food.length); return dd.length ? Math.round(dd.reduce((s,dt)=>s+d.days[dt].food.reduce((a,f)=>a+(f.calories||0),0),0)/dd.length) : 0; })();
  const avgEx  = (() => { const dd=l7.filter(dt=>d.days[dt].exercise.length); return dd.length ? Math.round(dd.reduce((s,dt)=>s+d.days[dt].exercise.reduce((a,e)=>a+(e.duration||0),0),0)/dd.length) : 0; })();
  const actDays = l7.filter(dt=>d.days[dt].exercise.length).length;

  document.getElementById('page-history').innerHTML = `
    <div class="ph"><h2>📋 History</h2><p>Your complete health log — last 60 days</p></div>
    <div class="mrow">
      <div class="mc g"><div class="ml">7-day avg calories</div><div class="mv">${avgCal.toLocaleString()}</div><div class="ms">kcal per day</div></div>
      <div class="mc b"><div class="ml">Avg exercise</div><div class="mv">${avgEx}<span style="font-size:14px;font-weight:400"> min</span></div><div class="ms">on active days</div></div>
      <div class="mc p"><div class="ml">Active days</div><div class="mv">${actDays}<span style="font-size:14px;font-weight:400">/7</span></div><div class="ms">this week</div></div>
    </div>
    <div class="card">
      <div class="ch"><div class="ct"><i class="ti ti-calendar"></i> Daily log</div><span class="bg bg-b">${dates.length} days</span></div>
      ${dates.length === 0
        ? `<div class="empty"><i class="ti ti-history"></i><p>No history yet — start logging today!</p></div>`
        : `<div style="overflow-x:auto"><table class="htable">
          <thead><tr><th>Date</th><th>Calories in</th><th>Exercise</th><th>Weight</th><th>BMI</th></tr></thead>
          <tbody>${dates.map(dt => {
            const day = d.days[dt];
            const cal = day.food.reduce((s,f)=>s+(f.calories||0),0);
            const exMin = day.exercise.reduce((s,e)=>s+(e.duration||0),0);
            const bw = day.weight&&p.height ? (day.weight/(p.height/100)**2).toFixed(1) : null;
            const isT = dt===tday();
            return `<tr ${isT?'style="background:#E1F5EE"':''}>
              <td style="font-weight:${isT?800:500}">${fmtS(dt)}</td>
              <td>${cal ? `<span class="bg ${cal>(p.calTarget||2000)?'bg-r':'bg-g'}">${cal.toLocaleString()}</span>` : '<span style="color:var(--subtle)">—</span>'}</td>
              <td>${exMin ? `<span class="bg bg-g">${exMin} min</span>` : '<span style="color:var(--subtle)">—</span>'}</td>
              <td>${day.weight ? `<strong>${day.weight}</strong> kg` : '<span style="color:var(--subtle)">—</span>'}</td>
              <td>${bw ? `<span class="bg ${bmiCat(bw).c}">${bw}</span>` : '<span style="color:var(--subtle)">—</span>'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`}
    </div>`;
}

/* ══════════ PROFILE ══════════ */

  const p = prof();
  document.getElementById('page-profile').innerHTML = `
    <div class="ph"><h2>⚙️ My profile</h2><p>Update details to keep calorie targets accurate</p></div>
    <div class="card">
      <div class="ct" style="margin-bottom:16px"><i class="ti ti-user"></i> Personal details</div>
      <div class="fg2">
        <div class="fg"><label>Name</label><input id="pe-name" value="${p.name||''}"></div>
        <div class="fg"><label>Age</label><input id="pe-age" type="number" value="${p.age||''}"></div>
      </div>
      <div class="fg2">
        <div class="fg"><label>Height (cm)</label><input id="pe-ht" type="number" value="${p.height||''}"></div>
        <div class="fg"><label>Sex</label>
          <select id="pe-sex"><option ${p.sex==='Male'?'selected':''}>Male</option><option ${p.sex==='Female'?'selected':''}>Female</option><option ${p.sex==='Other'?'selected':''}>Other</option></select>
        </div>
      </div>
      <div class="fg2">
        <div class="fg"><label>Goal</label>
          <select id="pe-goal">
            ${['Lose weight','Maintain weight','Build muscle','Improve overall health'].map(g=>`<option ${p.goal===g?'selected':''}>${g}</option>`).join('')}
          </select>
        </div>
        <div class="fg"><label>Activity level</label>
          <select id="pe-act">
            ${[[1.2,'Sedentary'],[1.375,'Light'],[1.55,'Moderate'],[1.725,'Active'],[1.9,'Very active']].map(([v,l])=>`<option value="${v}" ${p.act==v?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="fg"><label>Diet preference</label>
        <select id="pe-diet">${['Non-vegetarian','Vegetarian','Vegan','Pescatarian','Keto','Paleo'].map(d=>`<option ${p.diet===d?'selected':''}>${d}</option>`).join('')}</select>
      </div>
      <div class="fg"><label>Allergies / foods to avoid (comma-separated)</label>
        <input id="pe-allergy" value="${(p.allergies||[]).join(', ')}"></div>
      <div class="bgrp" style="margin-top:8px">
        <button class="btn btn-p" onclick="saveProfile()"><i class="ti ti-check"></i> Save &amp; recalculate targets</button>
        <button class="btn btn-d" onclick="delProfile()"><i class="ti ti-trash"></i> Delete profile</button>
      </div>
    </div>
    <div class="card" style="background:var(--blue-light);border-color:var(--blue)">
      <div class="ct" style="margin-bottom:12px;color:var(--blue-dark)"><i class="ti ti-calculator" style="color:var(--blue)"></i> Calculated targets</div>
      <div class="fg2">
        <div><div style="font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">TDEE (maintenance)</div>
          <div style="font-size:28px;font-weight:800;color:var(--blue-dark)">${p.tdee||'—'}</div>
          <div style="font-size:11px;color:var(--blue)">kcal/day</div>
        </div>
        <div><div style="font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Your adjusted target</div>
          <div style="font-size:28px;font-weight:800;color:var(--blue-dark)">${p.calTarget||'—'}</div>
          <div style="font-size:11px;color:var(--blue)">kcal/day (adjusted for "${p.goal}")</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--blue);margin-top:10px;opacity:.7">Harris-Benedict formula · updates when you save changes</div>
    </div>`;
}

function saveProfile() {
  const p = prof();
  p.name = document.getElementById('pe-name').value.trim() || p.name;
  p.age  = parseInt(document.getElementById('pe-age').value) || p.age;
  p.height = parseFloat(document.getElementById('pe-ht').value) || p.height;
  p.sex  = document.getElementById('pe-sex').value;
  p.goal = document.getElementById('pe-goal').value;
  p.act  = parseFloat(document.getElementById('pe-act').value) || p.act;
  p.diet = document.getElementById('pe-diet').value;
  p.allergies = document.getElementById('pe-allergy').value.split(',').map(s=>s.trim()).filter(Boolean);
  const w = lastWt() || p.weight || 70;
  const bmr = p.sex==='Male' ? 88.362+13.397*w+4.799*p.height-5.677*p.age : 447.593+9.247*w+3.098*p.height-4.330*p.age;
  p.tdee = Math.round(bmr * p.act);
  p.calTarget = p.goal==='Lose weight' ? Math.round(p.tdee-500) : p.goal==='Build muscle' ? Math.round(p.tdee+300) : p.tdee;
  save();
  document.getElementById('sb-name').textContent = p.name;
  document.getElementById('sb-av').textContent = inits(p.name);
  showToast('✅ Profile saved & targets updated!', 'green');
  renderProfile();
}

function delProfile() {
  if (!confirm('Delete this profile and ALL data permanently?')) return;
  S.profiles = S.profiles.filter(x => x.id !== S.current);
  delete S.data[S.current]; S.current = null; save(); goScr('profiles');
}

        ${key ? 'A key is saved. AI features are active.' : 'No key yet — AI nutrition lookup and suggestions are disabled until you add one.'}

      <div class="fg"><label>Paste your Gemini API key</label>

      </div>
      <div class="bgrp" style="margin-top:4px">

        ${key ? `<button class="btn btn-d" onclick="clearKey()"><i class="ti ti-trash"></i> Remove key</button>` : ''}

        <li>Go to <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--blue);font-weight:700">aistudio.google.com/apikey</a></li>

        The free tier gives you <strong>1,500 requests per day</strong> — far more than enough for daily tracking. Your key is stored only in this browser and is sent directly to Google, never to any other server.
      </div>

}

function saveKey() {
  const v = document.getElementById('set-key').value.trim();
  if (!v) { alert('Paste your Gemini API key first.'); return; }
  setApiKey(v);
  showToast('✅ API key saved!', 'green');
  renderSettings();
}

function clearKey() {
  if (!confirm('Remove the saved API key? AI features will stop working until you add one again.')) return;
  localStorage.removeItem('gemini_key');
  showToast('Key removed');
  renderSettings();
}

async function testKey() {
  const typed = document.getElementById('set-key').value.trim();
  if (typed) setApiKey(typed);
  const el = document.getElementById('key-test-result');
  if (!getApiKey()) { el.innerHTML = '<p style="color:var(--red);font-size:13px">Add a key first.</p>'; return; }
  el.innerHTML = `<div class="loading"><div class="spin"></div> Testing connection to Gemini…</div>`;
  const data = await callAI([{ role: 'user', content: 'Reply with exactly: OK' }], 10);
  if (data.error) {
    el.innerHTML = `<div class="notice notice-a" style="margin:0"><i class="ti ti-x" style="font-size:18px"></i> Failed: ${data.error.message}</div>`;
  } else {
    el.innerHTML = `<div class="notice notice-b" style="margin:0"><i class="ti ti-circle-check" style="font-size:18px"></i> Connected! Your key works. AI features are ready.</div>`;
  }
}

/* ══════════ CLOUD SYNC PAGE ══════════ */
function renderCloud() {
  const cid = getClientId();
  const enabled = driveEnabled();
  const origin = window.location.origin;
  document.getElementById('page-cloud').innerHTML = `
    <div class="ph"><h2>☁️ Cloud sync</h2><p>Sync your history across all your devices with Google Drive</p></div>

    <div class="card">
      <div class="ct" style="margin-bottom:14px"><i class="ti ti-cloud-cog"></i> Status</div>
      <div class="notice ${enabled ? 'notice-b' : 'notice-a'}" style="margin-bottom:14px">
        <i class="ti ti-${enabled ? 'cloud-check' : 'cloud-off'}" style="font-size:18px"></i>
        ${enabled ? `Cloud sync is ON. ${lastSync() ? 'Last synced: ' + lastSync() : 'Not synced yet — click Sync now.'}` : 'Cloud sync is off. Your data is only on this device.'}
      </div>
      ${enabled ? `
        <div class="bgrp">
          <button class="btn btn-p" onclick="cloudSyncBtn()"><i class="ti ti-refresh"></i> Sync now</button>
          <button class="btn btn-d" onclick="cloudDisconnect()"><i class="ti ti-cloud-off"></i> Turn off sync</button>
        </div>
      ` : cid ? `
        <button class="btn btn-p" onclick="cloudConnect()"><i class="ti ti-brand-google"></i> Connect Google Drive</button>
      ` : `<p style="font-size:13px;color:var(--muted)">Add your OAuth Client ID below first.</p>`}
    </div>

    <div class="card">
      <div class="ct" style="margin-bottom:14px"><i class="ti ti-id"></i> Google OAuth Client ID</div>
      <div class="fg"><label>Client ID (ends with .apps.googleusercontent.com)</label>
        <input id="cloud-cid" placeholder="${cid || '1234...apps.googleusercontent.com'}" value="${cid}">
      </div>
      <button class="btn btn-o" onclick="cloudSaveCid()"><i class="ti ti-check"></i> Save Client ID</button>
    </div>

    <div class="card" style="background:var(--blue-light);border-color:var(--blue)">
      <div class="ct" style="margin-bottom:12px;color:var(--blue-dark)"><i class="ti ti-help-circle" style="color:var(--blue)"></i> One-time setup (5 minutes)</div>
      <ol style="font-size:13px;line-height:1.9;color:var(--blue-dark);padding-left:20px;margin:0">
        <li>Go to <a href="https://console.cloud.google.com/projectcreate" target="_blank" style="color:var(--blue);font-weight:700">console.cloud.google.com</a> and create a project (free)</li>
        <li>In the search bar, find <strong>"Google Drive API"</strong> and click <strong>Enable</strong></li>
        <li>Go to <strong>APIs &amp; Services → OAuth consent screen</strong>. Choose <strong>External</strong>, fill in an app name and your email, and add yourself as a <strong>Test user</strong></li>
        <li>Go to <strong>APIs &amp; Services → Credentials → Create credentials → OAuth client ID</strong></li>
        <li>Application type: <strong>Web application</strong></li>
        <li>Under <strong>Authorized JavaScript origins</strong>, add this exact URL:<br>
          <code style="background:#fff;border:1px solid var(--blue);border-radius:4px;padding:3px 8px;display:inline-block;margin-top:4px;font-size:12px;color:var(--blue-dark)">${origin}</code>
          <button class="btn btn-o btn-sm" style="margin-left:6px" onclick="navigator.clipboard.writeText('${origin}');showToast('Copied!')"><i class="ti ti-copy"></i></button>
        </li>
        <li>Click <strong>Create</strong>, copy the <strong>Client ID</strong>, paste it in the box above, and click <strong>Save</strong></li>
        <li>Then click <strong>Connect Google Drive</strong> and approve access</li>
      </ol>
      <div style="font-size:12px;color:var(--blue-dark);opacity:.8;margin-top:12px;line-height:1.6">
        Your data is stored in a private folder only this app can access. To sync a second device, host the same app, enter the same Client ID, and connect — your history merges automatically.
      </div>
    </div>`;
}

function cloudSaveCid() {
  const v = document.getElementById('cloud-cid').value.trim();
  if (!v) { alert('Paste your OAuth Client ID.'); return; }
  setClientId(v);
  tokenClient = null; // re-init with new id
  showToast('✅ Client ID saved!', 'green');
  renderCloud();
}

async function cloudConnect() {
  if (!getClientId()) { alert('Save your Client ID first.'); return; }
  setSyncStatus('busy', 'Connecting…');
  setDriveEnabled(true);
  const ok = await driveSyncNow(true);
  if (ok) { showToast('✅ Google Drive connected & synced!', 'green'); }
  else { setDriveEnabled(false); }
  renderCloud();
}

async function cloudSyncBtn() {
  const ok = await driveSyncNow(true);
  if (ok) showToast('✅ Synced!', 'green');
  renderCloud();
}

function cloudDisconnect() {
  if (!confirm('Turn off cloud sync? Your data stays on this device but will no longer sync.')) return;
  setDriveEnabled(false);
  accessToken = null; driveFileId = null;
  setSyncStatus('off', 'Not synced');
  showToast('Cloud sync turned off');
  renderCloud();
}

/* ── INIT ── */
async function init() {
  await load();
  // Restore sync indicator state
  if (driveEnabled() && getClientId()) {
    setSyncStatus('on', lastSync() ? 'Synced ' + lastSync() : 'Sync ready');
    // Auto-sync on load (pull latest from other devices), after GIS loads
    setTimeout(() => driveSyncNow(false), 1500);
  } else {
    setSyncStatus('off', 'Not synced');
  }
  if (S.profiles.length && S.current && S.profiles.find(p => p.id === S.current)) {
    selProf(S.current);
  } else {
    renderProfiles(); goScr('profiles');
  }
}
init();
</script>
